      text-decoration: none; font-weight: 700; color: #251a07;
      background: linear-gradient(100deg, #f6dc99, #dca83e);
      border: 1px solid rgba(255, 235, 180, .8);
      transition: transform .18s ease, filter .18s ease;
    }
    .link:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .link.secondary {
      color: #fff4dc; background: #292319; border: 1px solid #76603a;
    }
    .hint { margin: 22px 0 0; color: #a99b7d; font-size: 12px; }
